<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexagonal Canvas</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      * {
        scrollbar-width: none;
      }

      *::-webkit-scrollbar {
        display: none;
      }

      canvas {
        display: block;
      }

      .hex-menu {
        position: fixed;
        z-index: 2;
        width: 176px;
        padding: 8px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        color: rgba(0, 0, 0, 0.72);
        font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
      }

      .hex-menu[hidden] {
        display: none;
      }

      .hex-menu-id {
        margin: 2px 4px 8px;
        font-variant-numeric: tabular-nums;
      }

      .hex-menu-icons {
        display: grid;
        grid-template-columns: repeat(4, 36px);
        gap: 4px;
      }

      .hex-menu button {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .hex-menu-icons button {
        width: 36px;
        height: 36px;
        padding: 6px;
      }

      .hex-menu-icons img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hex-menu button:hover,
      .hex-menu button[aria-checked="true"] {
        background: rgba(0, 0, 0, 0.06);
      }

      .hex-menu-clear {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 6px 8px;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <canvas id="app"></canvas>
    <div id="hex-menu" class="hex-menu" role="menu" hidden>
      <div class="hex-menu-id"></div>
      <div class="hex-menu-icons"></div>
      <button type="button" class="hex-menu-clear" data-action="clear">清除</button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
